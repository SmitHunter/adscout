[project]
name = "adscout"
version = "0.1.0"
description = "Local tool that reads the public Meta Ad Library and scores dropshipping products"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SmitHunter" }]
keywords = ["meta-ad-library", "dropshipping", "ads", "research", "fastapi", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.15.0",
    "apscheduler>=3.10,<4",
    "fastapi>=0.143.3",
    "filelock>=4.2.0",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "rich>=15.0.0",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.5.0",
    "typer>=0.27.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/SmitHunter/adscout"
Repository = "https://github.com/SmitHunter/adscout"
Issues = "https://github.com/SmitHunter/adscout/issues"

[project.scripts]
adscout = "adscout.cli:app"

[project.optional-dependencies]
notify = [
    "desktop-notifier>=6.2.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: builds the demo data several times (runs by default; deselect with -m \"not slow\")",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pypdf>=6.21.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]
